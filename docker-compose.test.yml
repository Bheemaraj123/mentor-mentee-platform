version: '3.8'

services:
  test-db:
    image: postgres:15
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=mentor_mentee_test
    volumes:
      - ./storage/test_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  test-backend:
    build: ./backend
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@test-db:5432/mentor_mentee_test
      - POSTGRES_SERVER=test-db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=mentor_mentee_test
      - POSTGRES_PORT=5432
      - SECRET_KEY=test_secret_key_for_testing_only
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
      - OPENAI_API_KEY=your_openai_api_key_here
      - LLM_PROVIDER=openai
      - LLM_MODEL=gpt-4o-mini
      - WHISPER_MODEL=base
    depends_on:
      test-db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && python app/core/seed.py && pytest tests/ -v"

  test-frontend:
    build: ./frontend
    ports:
      - "5174:5173"
    environment:
      - VITE_API_URL=http://localhost:8001/api/v1
    depends_on:
      - test-backend
    command: npm run test:run